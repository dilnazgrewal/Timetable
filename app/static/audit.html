<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TimeWeave · Audit log</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="/static/js/shell.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  [x-cloak] { display: none !important; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<!-- Lane A owns this page: who did what (timetable office and Dean). -->
<body class="bg-slate-50 text-slate-800 min-h-screen">
<div class="max-w-5xl mx-auto px-4"><div id="tw-shell"></div></div>
<main x-data="auditApp()" x-init="init()" x-cloak class="max-w-5xl mx-auto px-4 pb-16">
  <h1 class="text-xl font-bold mt-2">Audit log</h1>
  <p class="text-sm text-slate-500">Every privileged action (generating, publishing, substitutions, leave, approvals, optimiser runs), whether it was allowed or refused.</p>
  <div x-show="error" class="mt-4 rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-800" x-text="error"></div>
  <div class="mt-3 flex items-center gap-2 text-sm">
    <label><input type="checkbox" x-model="refusedOnly"> refused only</label>
    <button @click="load()" class="ml-auto text-indigo-700">↻ Refresh</button>
  </div>
  <div class="mt-2 overflow-x-auto rounded-xl border bg-white">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 text-left"><tr>
        <th class="p-2">When</th><th class="p-2">Who</th><th class="p-2">Action</th><th class="p-2">On</th><th class="p-2">Result</th>
      </tr></thead>
      <tbody>
        <template x-for="(a, i) in items.filter(a => !refusedOnly || !a.allowed)" :key="i">
          <tr class="border-t">
            <td class="p-2 whitespace-nowrap text-slate-500" x-text="a.at.replace('T', ' ')"></td>
            <td class="p-2"><span x-text="a.name"></span> <span class="text-xs text-slate-400" x-text="'(' + a.role + ')'"></span></td>
            <td class="p-2 font-mono text-xs" x-text="a.action"></td>
            <td class="p-2 text-xs" x-text="a.on"></td>
            <td class="p-2"><span class="text-xs px-2 py-0.5 rounded-full" :class="a.allowed ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700'" x-text="a.allowed ? 'allowed' : 'refused'"></span></td>
          </tr>
        </template>
        <tr x-show="!items.length"><td colspan="5" class="p-4 text-center text-slate-400">Nothing yet.</td></tr>
      </tbody>
    </table>
  </div>
</main>
<script>
function auditApp() {
  return {
    items: [], error: '', refusedOnly: false,
    async init() { await TW.ready; await this.load(); },
    async load() {
      try { this.items = (await TW.api('/api/audit?limit=500')).items; this.error = ''; }
      catch (e) { this.error = e.message; }
    },
  };
}
</script>
</body>
</html>
