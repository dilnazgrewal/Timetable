<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TimeWeave · Sign in</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  [x-cloak] { display: none !important; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<!-- Lane A owns this page: sign-in. Demo mode = choose any account without a password. -->
<body class="bg-slate-50 text-slate-800 min-h-screen">
<main x-data="loginApp()" x-init="init()" x-cloak class="max-w-3xl mx-auto px-4 py-8">
  <div class="flex items-center gap-3 mb-6">
    <span class="h-11 w-11 rounded-xl bg-indigo-600 text-white grid place-items-center font-bold text-lg">TW</span>
    <div>
      <h1 class="text-2xl font-bold leading-tight">Sign in to TimeWeave</h1>
      <p class="text-sm text-slate-500">GNDEC Ludhiana · timetables, free rooms, venues and substitutions</p>
    </div>
  </div>

  <button disabled class="w-full rounded-xl border bg-white px-4 py-3 text-left text-slate-400 cursor-not-allowed">
    <b>Sign in with your college Google account</b> <span class="text-xs">(@gndec.ac.in, coming soon)</span>
  </button>

  <template x-if="demo">
    <section class="mt-6 rounded-xl border bg-white p-4">
      <div class="flex items-center gap-2 mb-1">
        <h2 class="font-semibold">Demo sign-in</h2>
        <span class="text-xs px-2 py-0.5 rounded bg-amber-100 text-amber-800">no password, for judging</span>
      </div>
      <p class="text-sm text-slate-500 mb-3">Choose who you are. Each role sees only what it is allowed to use.</p>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <template x-for="g in Object.keys(groups)" :key="g">
          <button @click="pick(g)" class="rounded-lg border px-2 py-2 text-left text-sm"
                  :class="role === g ? 'border-indigo-500 bg-indigo-50' : 'bg-white hover:bg-slate-50'">
            <div class="font-semibold" x-text="groups[g].name"></div>
            <div class="text-[11px] text-slate-500 leading-tight" x-text="groups[g].about"></div>
          </button>
        </template>
      </div>

      <div x-show="role" class="mt-4">
        <!-- students: department, year, section; then (optional) their group and subjects -->
        <template x-if="role === 'student'">
          <div class="space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <label class="text-xs text-slate-500">Department
                <select x-model="dept" @change="year = ''; section = ''; choice = {}" class="mt-0.5 w-full border rounded-lg px-2 py-1.5 bg-white text-sm text-slate-800">
                  <option value="">Choose…</option>
                  <template x-for="d in depts()" :key="d"><option :value="d" x-text="d"></option></template>
                </select></label>
              <label class="text-xs text-slate-500">Year
                <select x-model="year" @change="section = ''; choice = {}" :disabled="!dept" class="mt-0.5 w-full border rounded-lg px-2 py-1.5 bg-white text-sm text-slate-800">
                  <option value="">Choose…</option>
                  <template x-for="y in years()" :key="y"><option :value="y" x-text="yearLabel(y)"></option></template>
                </select></label>
              <label class="text-xs text-slate-500">Section
                <select x-model="section" @change="pickSection()" :disabled="!year" class="mt-0.5 w-full border rounded-lg px-2 py-1.5 bg-white text-sm text-slate-800">
                  <option value="">Choose…</option>
                  <template x-for="x in sections()" :key="x.id"><option :value="x.id" x-text="x.name"></option></template>
                </select></label>
            </div>
            <div x-show="section && keys().length" class="rounded-lg bg-slate-50 border p-3">
              <div class="text-xs text-slate-500 mb-2">Your group and subjects: we filled in the most common choice, change any that differ for you.</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <template x-for="k in keys()" :key="k">
                  <label class="text-xs text-slate-500"><span x-text="k"></span>
                    <select @change="setChoice(k, $event.target.value)" class="mt-0.5 w-full border rounded-lg px-2 py-1.5 bg-white text-sm text-slate-800">
                      <template x-for="o in options(k)" :key="o"><option :value="o" :selected="o === choice[k]" x-text="o"></option></template>
                    </select></label>
                </template>
              </div>
            </div>
            <button x-show="section" @click="match() && signIn(match().id)" :disabled="!match()"
                    class="w-full sm:w-auto rounded-lg bg-indigo-600 text-white px-4 py-2 text-sm font-semibold disabled:opacity-50">Show my timetable</button>
            <div x-show="clubs().length" class="text-xs text-slate-500">Club lead?
              <template x-for="u in clubs()" :key="u.id">
                <button @click="signIn(u.id)" class="ml-1 underline text-indigo-700" x-text="u.name.replace(' (student lead)', '')"></button>
              </template>
            </div>
          </div>
        </template>
        <input x-show="role && role !== 'student'" x-model="q" placeholder="Search by name or department" class="w-full border rounded-lg px-3 py-2 text-sm mb-2">
        <div x-show="role && role !== 'student'" class="max-h-80 overflow-y-auto divide-y rounded-lg border">
          <template x-for="u in list()" :key="u.id">
            <button @click="signIn(u.id)" class="w-full text-left px-3 py-2 text-sm hover:bg-indigo-50">
              <span x-text="label(u)"></span>
              <span x-show="duty(u)" class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-800" x-text="duty(u)"></span>
              <span x-show="u.dept && role !== 'student'" class="text-xs text-slate-400" x-text="' · ' + u.dept"></span>
            </button>
          </template>
          <div x-show="!list().length" class="px-3 py-3 text-sm text-slate-400">No match.</div>
        </div>
      </div>
      <p x-show="error" class="mt-2 text-sm text-red-700" x-text="error"></p>
    </section>
  </template>
  <p x-show="!demo && loaded" class="mt-6 text-sm text-slate-500">Demo sign-in is switched off on this server.</p>
</main>
<script>
function loginApp() {
  return {
    demo: false, loaded: false, accounts: { roles: {}, role_names: {} }, role: '', q: '', dept: '', year: '', section: '',
    choice: {}, error: '',
    // four roles; club lead, timetable coordinator, Dean and the offices are extra duties inside them
    groups: {
      student: { name: 'Student', roles: ['club', 'student'], about: 'Your timetable, free rooms, meet a teacher (club leads too)' },
      teacher: { name: 'Teacher', roles: ['teacher', 'coordinator'], about: 'Your schedule, leave, meetings, venues (timetable coordinators too)' },
      hod: { name: 'HOD', roles: ['hod'], about: 'Your department: substitutions, venue approvals, optimised timetable' },
      admin: { name: 'Timetable office', roles: ['admin', 'dean', 'org'], about: 'Publishes timetables; also the Dean, T&P cell and visitors' },
    },
    next() { const n = new URLSearchParams(location.search).get('next'); return n && n.startsWith('/') && !n.startsWith('//') ? n : '/'; },
    async init() {
      const me = await fetch('/api/me', { credentials: 'same-origin' });
      if (me.ok) { location.href = this.next(); return; }
      const r = await fetch('/api/auth/demo-accounts');
      this.demo = r.ok; this.loaded = true;
      if (r.ok) this.accounts = await r.json();
    },
    pick(r) { this.role = r; this.q = ''; this.error = ''; },
    students() { return this.accounts.roles.student || []; },
    clubs() { return this.accounts.roles.club || []; },
    depts() { return [...new Set(this.students().map(u => u.dept))].sort(); },
    years() { return [...new Set(this.students().filter(u => u.dept === this.dept).map(u => String(u.year)))].sort(); },
    yearLabel(y) { return { 1: '1st year', 2: '2nd year', 3: '3rd year', 4: '4th year', 5: 'M.Tech', 6: 'PhD' }[y] || y; },
    sections() {
      const seen = {};
      this.students().filter(u => u.dept === this.dept && String(u.year) === this.year).forEach(u => seen[u.section] = u.section_name);
      return Object.entries(seen).map(([id, name]) => ({ id, name })).sort((a, b) => a.name.localeCompare(b.name));
    },
    types() { return this.students().filter(u => u.section === this.section); },
    keys() { const t = this.types()[0]; return t ? Object.keys(t.details || {}) : []; },
    fits(t, upto) { return this.keys().slice(0, upto).every(k => t.details[k] === this.choice[k]); },
    options(k) {  // only choices that exist together with the ones above it
      const i = this.keys().indexOf(k);
      return [...new Set(this.types().filter(t => this.fits(t, i)).map(t => t.details[k]))].sort();
    },
    fill() {  // keep every choice valid, preferring the most common combination
      const keys = this.keys();
      keys.forEach((k, i) => {
        const ok = this.types().filter(t => this.fits(t, i));
        if (!ok.some(t => t.details[k] === this.choice[k])) {
          const best = ok.reduce((a, t) => (t.count || 0) > (a.count || 0) ? t : a, ok[0]);
          this.choice[k] = best ? best.details[k] : '';
        }
      });
      this.choice = { ...this.choice };
    },
    pickSection() { this.choice = {}; this.fill(); },
    setChoice(k, v) { this.choice[k] = v; this.fill(); },
    match() { return this.types().find(t => this.keys().every(k => t.details[k] === this.choice[k])); },
    label(u) { return u.role === 'student' ? u.name.replace(/^Student · /, '').replace(/^[^·]+· /, '') : u.name; },
    duty(u) { return u.role === this.groups[this.role].roles.find(r => r === 'student' || r === 'teacher' || r === 'hod' || r === 'admin') ? '' : (this.accounts.role_names[u.role] || ''); },
    list() {
      const all = (this.groups[this.role]?.roles || []).flatMap(r => (this.accounts.roles[r] || []).map(u => ({ ...u, role: r })));
      if (this.role === 'student') {
        return [...all.filter(u => u.role === 'club'), ...(this.section ? all.filter(u => u.role === 'student' && this.sectionOf(u) === this.section) : [])];
      }
      const q = this.q.toLowerCase();
      return all.filter(u => !q || u.name.toLowerCase().includes(q) || (u.dept || '').toLowerCase().includes(q)).slice(0, 200);
    },
    async signIn(id) {
      this.error = '';
      const r = await fetch('/api/auth/demo-login', { method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: id }) });
      if (!r.ok) { this.error = (await r.json().catch(() => ({}))).detail || 'Could not sign in.'; return; }
      try { localStorage.setItem('tw-user', id); } catch {}
      location.href = this.next();
    },
  };
}
</script>
</body>
</html>
